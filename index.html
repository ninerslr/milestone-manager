<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milestone Manager Wireframe</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #fff; --ink: #222; --muted: #777; --line: #bbb;
    --fill: #e6e6e3; --accent: #3a6ea5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 24px; padding: 12px 20px; background: var(--panel); border-bottom: 2px solid var(--ink); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  .tag { font-size: 11px; border: 1px dashed var(--muted); color: var(--muted); padding: 2px 6px; border-radius: 3px; }
  nav { display: flex; gap: 4px; }
  nav button { background: none; border: 1px solid var(--line); padding: 6px 14px; cursor: pointer; border-radius: 3px; }
  nav button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  main { padding: 20px; }
  .layout { display: grid; grid-template-columns: 240px 1fr; gap: 20px; }
  .box { background: var(--panel); border: 1.5px solid var(--ink); border-radius: 4px; padding: 14px; }
  .box h2 { font-size: 15px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; }
  .box h3 { font-size: 14px; margin: 0; }
  .list-item { padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px; margin-bottom: 6px; cursor: pointer; background: var(--panel); }
  .list-item.active { border-color: var(--ink); background: var(--fill); font-weight: 600; }
  .list-item small { display: block; color: var(--muted); font-weight: 400; }
  .cols { display: grid; grid-template-columns: 280px 1fr; gap: 16px; margin-top: 16px; }
  .check-row { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px dotted var(--line); }
  .check-row small { display: block; color: var(--muted); }
  .card { border: 1.5px solid var(--ink); border-radius: 4px; padding: 12px; margin-bottom: 12px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .meta { display: flex; gap: 12px; color: var(--muted); font-size: 12px; margin: 6px 0 10px; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--fill); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .chip button { border: none; background: none; cursor: pointer; color: var(--muted); padding: 0; font-size: 14px; line-height: 1; }
  .placeholder { color: var(--muted); font-style: italic; font-size: 12px; }
  select, input { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 3px; background: #fff; }
  .btn { border: 1px solid var(--ink); background: #fff; padding: 4px 10px; border-radius: 3px; cursor: pointer; }
  .btn.primary { background: var(--ink); color: #fff; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; color: var(--muted); }
  .note { margin-top: 20px; padding: 10px 14px; border: 1px dashed var(--muted); color: var(--muted); font-size: 12px; background: transparent; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .name-input { font-size: 15px; font-weight: 600; border: 1px dashed transparent; padding: 2px 4px; min-width: 0; flex: 1; }
  .name-input:hover, .name-input:focus { border-color: var(--line); }
  h2 .name-input { font-size: 15px; text-transform: none; letter-spacing: 0; }
  .btn.danger { border-color: #a33; color: #a33; }
  .add-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .add-row input { flex: 1; min-width: 140px; }
  .project-group { border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin-bottom: 10px; }
  .project-group h3 { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .project-group .check-row:last-child { border-bottom: none; }
  .check-row input { margin-top: 3px; }
  @media (max-width: 800px) { .layout, .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Milestone Manager</h1>
  <span class="tag">WIREFRAME: edits not saved</span>
  <nav id="nav">
    <button data-tab="projects">By Project</button>
    <button data-tab="resources">By Resource</button>
  </nav>
  <button class="btn" id="download">Download CSV</button>
</header>
<main id="app"></main>

<script src="app.js"></script>
</body>
</html>
