<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milestone Manager Wireframe</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #fff; --ink: #222; --muted: #777; --line: #bbb;
    --fill: #e6e6e3; --accent: #3a6ea5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 24px; padding: 12px 20px; background: var(--panel); border-bottom: 2px solid var(--ink); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  .tag { font-size: 11px; border: 1px dashed var(--muted); color: var(--muted); padding: 2px 6px; border-radius: 3px; }
  nav { display: flex; gap: 4px; }
  nav button { background: none; border: 1px solid var(--line); padding: 6px 14px; cursor: pointer; border-radius: 3px; }
  nav button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  main { padding: 20px; }
  .layout { display: grid; grid-template-columns: 240px 1fr; gap: 20px; }
  .box { background: var(--panel); border: 1.5px solid var(--ink); border-radius: 4px; padding: 14px; }
  .box h2 { font-size: 15px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; }
  .box h3 { font-size: 14px; margin: 0; }
  .list-item { padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px; margin-bottom: 6px; cursor: pointer; background: var(--panel); }
  .list-item.active { border-color: var(--ink); background: var(--fill); font-weight: 600; }
  .list-item small { display: block; color: var(--muted); font-weight: 400; }
  .cols { display: grid; grid-template-columns: 280px 1fr; gap: 16px; margin-top: 16px; }
  .check-row { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px dotted var(--line); }
  .check-row small { display: block; color: var(--muted); }
  .card { border: 1.5px solid var(--ink); border-radius: 4px; padding: 12px; margin-bottom: 12px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .meta { display: flex; gap: 12px; color: var(--muted); font-size: 12px; margin: 6px 0 10px; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--fill); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .chip button { border: none; background: none; cursor: pointer; color: var(--muted); padding: 0; font-size: 14px; line-height: 1; }
  .placeholder { color: var(--muted); font-style: italic; font-size: 12px; }
  select, input { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 3px; background: #fff; }
  .btn { border: 1px solid var(--ink); background: #fff; padding: 4px 10px; border-radius: 3px; cursor: pointer; }
  .btn.primary { background: var(--ink); color: #fff; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; color: var(--muted); }
  .note { margin-top: 20px; padding: 10px 14px; border: 1px dashed var(--muted); color: var(--muted); font-size: 12px; background: transparent; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  @media (max-width: 800px) { .layout, .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Milestone Manager</h1>
  <span class="tag">WIREFRAME: sample data, not saved</span>
  <nav id="nav">
    <button data-tab="projects">Projects</button>
    <button data-tab="employees">Employees</button>
    <button data-tab="library">Milestone Library</button>
  </nav>
</header>
<main id="app"></main>

<script>
// ---- Sample data (in-memory only) ----
const state = {
  tab: 'projects',
  selectedProjectId: 'p1',
  selectedEmployeeId: 'e1',
  projects: [
    { id: 'p1', name: 'Riverside Plant Upgrade', client: 'Acme Water' },
    { id: 'p2', name: 'ERP Migration', client: 'Internal' },
    { id: 'p3', name: 'Line 4 Automation', client: 'Northwind Foods' },
  ],
  milestones: [ // reusable library
    { id: 'm1', name: 'Kickoff', desc: 'Project kickoff meeting and charter sign-off' },
    { id: 'm2', name: 'Design Review', desc: 'Functional / detailed design approval' },
    { id: 'm3', name: 'FAT', desc: 'Factory acceptance test' },
    { id: 'm4', name: 'SAT', desc: 'Site acceptance test' },
    { id: 'm5', name: 'Commissioning', desc: 'Start-up and commissioning' },
    { id: 'm6', name: 'Training', desc: 'Operator and maintenance training' },
    { id: 'm7', name: 'Handover', desc: 'Final documentation and closeout' },
  ],
  employees: [
    { id: 'e1', name: 'Alex Rivera', role: 'Project Manager' },
    { id: 'e2', name: 'Jordan Lee', role: 'Controls Engineer' },
    { id: 'e3', name: 'Sam Patel', role: 'Controls Engineer' },
    { id: 'e4', name: 'Casey Morgan', role: 'Field Technician' },
    { id: 'e5', name: 'Taylor Brooks', role: 'QA Lead' },
    { id: 'e6', name: 'Morgan Diaz', role: 'Trainer' },
  ],
  // A milestone selected for a project
  projectMilestones: [
    { id: 'pm1', projectId: 'p1', milestoneId: 'm1', due: '2026-10-05', status: 'Complete' },
    { id: 'pm2', projectId: 'p1', milestoneId: 'm2', due: '2026-11-02', status: 'In progress' },
    { id: 'pm3', projectId: 'p1', milestoneId: 'm3', due: '2027-01-15', status: 'Planned' },
    { id: 'pm4', projectId: 'p2', milestoneId: 'm1', due: '2026-10-20', status: 'Planned' },
    { id: 'pm5', projectId: 'p3', milestoneId: 'm4', due: '2026-12-01', status: 'Planned' },
  ],
  // Many-to-many: employee <-> project milestone
  assignments: [
    { pmId: 'pm1', employeeId: 'e1' }, { pmId: 'pm1', employeeId: 'e2' },
    { pmId: 'pm2', employeeId: 'e2' }, { pmId: 'pm2', employeeId: 'e3' }, { pmId: 'pm2', employeeId: 'e1' },
    { pmId: 'pm3', employeeId: 'e5' },
    { pmId: 'pm4', employeeId: 'e1' },
    { pmId: 'pm5', employeeId: 'e4' }, { pmId: 'pm5', employeeId: 'e2' },
  ],
};
const STATUSES = ['Planned', 'In progress', 'Complete', 'Blocked'];
let seq = 100;
const uid = p => p + (++seq);

// ---- Lookups ----
const byId = (arr, id) => arr.find(x => x.id === id);
const pmsFor = projectId => state.projectMilestones.filter(pm => pm.projectId === projectId);
const empsFor = pmId => state.assignments.filter(a => a.pmId === pmId).map(a => byId(state.employees, a.employeeId));
const pmsForEmployee = empId => state.assignments.filter(a => a.employeeId === empId).map(a => byId(state.projectMilestones, a.pmId));
const pmLabel = pm => `${byId(state.projects, pm.projectId).name} › ${byId(state.milestones, pm.milestoneId).name}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---- Views ----
function viewProjects() {
  const project = byId(state.projects, state.selectedProjectId);
  const selected = pmsFor(project.id);
  const selectedIds = new Set(selected.map(pm => pm.milestoneId));
  return `
  <div class="layout">
    <div class="box">
      <h2>Projects</h2>
      ${state.projects.map(p => `
        <div class="list-item ${p.id === project.id ? 'active' : ''}" data-action="pick-project" data-id="${p.id}">
          ${esc(p.name)}<small>${esc(p.client)} · ${pmsFor(p.id).length} milestones</small>
        </div>`).join('')}
    </div>
    <div class="box">
      <h2>${esc(project.name)}</h2>
      <div class="meta"><span>Client: ${esc(project.client)}</span><span>${selected.length} milestones selected</span></div>
      <div class="cols">
        <div class="box">
          <h2>Select milestones</h2>
          ${state.milestones.map(m => `
            <label class="check-row">
              <input type="checkbox" data-action="toggle-milestone" data-id="${m.id}" ${selectedIds.has(m.id) ? 'checked' : ''}>
              <span>${esc(m.name)}<small>${esc(m.desc)}</small></span>
            </label>`).join('')}
        </div>
        <div>
          ${selected.length ? selected.map(cardForPm).join('') : '<p class="placeholder">No milestones selected. Tick one on the left.</p>'}
        </div>
      </div>
    </div>
  </div>`;
}

function cardForPm(pm) {
  const m = byId(state.milestones, pm.milestoneId);
  const assigned = empsFor(pm.id);
  const available = state.employees.filter(e => !assigned.includes(e));
  return `
  <div class="card">
    <div class="card-head">
      <h3>${esc(m.name)}</h3>
      <select data-action="set-status" data-id="${pm.id}">
        ${STATUSES.map(s => `<option ${s === pm.status ? 'selected' : ''}>${s}</option>`).join('')}
      </select>
    </div>
    <div class="meta">
      <span>Due: <input type="date" value="${pm.due}" data-action="set-due" data-id="${pm.id}"></span>
      <span>${assigned.length} assigned</span>
    </div>
    <div class="chips">
      ${assigned.map(e => `<span class="chip">${esc(e.name)}<button title="Remove" data-action="unassign" data-pm="${pm.id}" data-emp="${e.id}">×</button></span>`).join('')
        || '<span class="placeholder">No one assigned</span>'}
      ${available.length ? `
        <select data-action="assign" data-pm="${pm.id}">
          <option value="">+ Assign employee…</option>
          ${available.map(e => `<option value="${e.id}">${esc(e.name)} (${esc(e.role)})</option>`).join('')}
        </select>` : ''}
    </div>
  </div>`;
}

function viewEmployees() {
  const emp = byId(state.employees, state.selectedEmployeeId);
  const pms = pmsForEmployee(emp.id);
  const unassigned = state.projectMilestones.filter(pm => !pms.includes(pm));
  return `
  <div class="layout">
    <div class="box">
      <h2>Employees</h2>
      ${state.employees.map(e => `
        <div class="list-item ${e.id === emp.id ? 'active' : ''}" data-action="pick-employee" data-id="${e.id}">
          ${esc(e.name)}<small>${esc(e.role)} · ${pmsForEmployee(e.id).length} milestones</small>
        </div>`).join('')}
    </div>
    <div class="box">
      <h2>${esc(emp.name)}</h2>
      <div class="meta"><span>${esc(emp.role)}</span><span>${pms.length} milestone associations</span></div>
      <table>
        <thead><tr><th>Project</th><th>Milestone</th><th>Due</th><th>Status</th><th>Also assigned</th><th></th></tr></thead>
        <tbody>
          ${pms.map(pm => `
            <tr>
              <td>${esc(byId(state.projects, pm.projectId).name)}</td>
              <td>${esc(byId(state.milestones, pm.milestoneId).name)}</td>
              <td>${pm.due}</td>
              <td>${pm.status}</td>
              <td>${empsFor(pm.id).filter(e => e !== emp).map(e => esc(e.name)).join(', ') || '<span class="placeholder">none</span>'}</td>
              <td><button class="btn" data-action="unassign" data-pm="${pm.id}" data-emp="${emp.id}">Remove</button></td>
            </tr>`).join('') || '<tr><td colspan="6" class="placeholder">No milestone associations.</td></tr>'}
        </tbody>
      </table>
      ${unassigned.length ? `
        <div class="row" style="margin-top:14px">
          <select id="emp-add">
            <option value="">+ Associate with a project milestone…</option>
            ${unassigned.map(pm => `<option value="${pm.id}">${esc(pmLabel(pm))}</option>`).join('')}
          </select>
          <button class="btn primary" data-action="emp-assign" data-emp="${emp.id}">Add</button>
        </div>` : ''}
    </div>
  </div>`;
}

function viewLibrary() {
  return `
  <div class="box">
    <h2>Milestone Library</h2>
    <p class="placeholder">Reusable milestones that projects select from.</p>
    <table>
      <thead><tr><th>Milestone</th><th>Description</th><th>Used on projects</th></tr></thead>
      <tbody>
        ${state.milestones.map(m => {
          const used = state.projectMilestones.filter(pm => pm.milestoneId === m.id).map(pm => esc(byId(state.projects, pm.projectId).name));
          return `<tr><td>${esc(m.name)}</td><td>${esc(m.desc)}</td><td>${used.join(', ') || '<span class="placeholder">unused</span>'}</td></tr>`;
        }).join('')}
      </tbody>
    </table>
    <div class="row" style="margin-top:14px">
      <input id="lib-name" placeholder="Milestone name">
      <input id="lib-desc" placeholder="Description" style="flex:1;min-width:180px">
      <button class="btn primary" data-action="lib-add">Add milestone</button>
    </div>
  </div>`;
}

// ---- Render + events ----
function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  const view = { projects: viewProjects, employees: viewEmployees, library: viewLibrary }[state.tab];
  document.getElementById('app').innerHTML = view() +
    `<div class="note">Wireframe: layout and flow only. All data is sample data held in memory and resets on reload.</div>`;
}

document.getElementById('nav').addEventListener('click', e => {
  if (e.target.dataset.tab) { state.tab = e.target.dataset.tab; render(); }
});

document.getElementById('app').addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const a = t.dataset.action;
  if (a === 'pick-project') state.selectedProjectId = t.dataset.id;
  else if (a === 'pick-employee') state.selectedEmployeeId = t.dataset.id;
  else if (a === 'unassign') state.assignments = state.assignments.filter(x => !(x.pmId === t.dataset.pm && x.employeeId === t.dataset.emp));
  else if (a === 'emp-assign') {
    const pmId = document.getElementById('emp-add').value;
    if (!pmId) return;
    state.assignments.push({ pmId, employeeId: t.dataset.emp });
  } else if (a === 'lib-add') {
    const name = document.getElementById('lib-name').value.trim();
    if (!name) return;
    state.milestones.push({ id: uid('m'), name, desc: document.getElementById('lib-desc').value.trim() });
  } else return;
  render();
});

document.getElementById('app').addEventListener('change', e => {
  const t = e.target, a = t.dataset.action;
  if (a === 'toggle-milestone') {
    const pid = state.selectedProjectId;
    if (t.checked) {
      state.projectMilestones.push({ id: uid('pm'), projectId: pid, milestoneId: t.dataset.id, due: '', status: 'Planned' });
    } else {
      const pm = state.projectMilestones.find(x => x.projectId === pid && x.milestoneId === t.dataset.id);
      state.projectMilestones = state.projectMilestones.filter(x => x !== pm);
      state.assignments = state.assignments.filter(x => x.pmId !== pm.id);
    }
  } else if (a === 'assign' && t.value) state.assignments.push({ pmId: t.dataset.pm, employeeId: t.value });
  else if (a === 'set-status') byId(state.projectMilestones, t.dataset.id).status = t.value;
  else if (a === 'set-due') { byId(state.projectMilestones, t.dataset.id).due = t.value; return; }
  else return;
  render();
});

render();
</script>
</body>
</html>
